# jellyfin.example.com

server {
    listen 443 ssl;
    http2 on;

    server_name jellyfin.example.com;

    ssl_certificate     /etc/letsencrypt/live/jellyfin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jellyfin.example.com/privkey.pem;

    error_log  /var/log/openresty/com.example.jellyfin_nginx_err.log warn;
    access_log /var/log/openresty/com.example.jellyfin_nginx_acc.log combined;

    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support — required for Jellyfin media streaming
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Video/audio streams routinely run hundreds of MB to several GB -
        # far past any reasonably-sized proxy_buffers/proxy_max_temp_file_size,
        # so nginx would spill every stream to a temp file under
        # /var/cache/openresty (disk I/O + added latency before the first
        # byte reaches the client) and still log "an upstream response is
        # buffered to a temporary file" for basically every playback. Applied
        # vhost-wide rather than scoped to just the streaming paths: at
        # home-lab scale the buffering protection this trades away (freeing
        # the upstream connection quickly when the client is slow) isn't
        # worth the extra location blocks it'd take to scope it, since
        # Jellyfin's own JSON API responses are small either way. Also
        # recommended in Jellyfin's own nginx reverse-proxy guide:
        # https://jellyfin.org/docs/general/post-install/networking/reverse-proxy/nginx
        proxy_buffering off;

        access_by_lua_block {
            local core = require "waf.core"
            local app  = require "waf.apps.jellyfin"
            core.run(app)
        }
    }
}
