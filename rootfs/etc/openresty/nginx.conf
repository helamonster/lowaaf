worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    server_tokens off;

    # Make the WAF framework and app policy modules available.
    # waf/core.lua and waf/apps/*.lua live under this path.
    lua_package_path "/etc/openresty/?.lua;;";

    # HTTP → HTTPS redirect for all virtual hosts
    server {
        listen 80 default_server;
        return 301 https://$host$request_uri;
    }

    # Per-application virtual hosts
    include /etc/openresty/com.example.vaultwarden_nginx.conf;
    include /etc/openresty/com.example.jellyfin_nginx.conf;
    include /etc/openresty/com.example.mediawiki_nginx.conf;
}
