# mediawiki.example.com

server {
    listen 443 ssl;
    http2 on;

    server_name mediawiki.example.com;

    ssl_certificate     /etc/letsencrypt/live/mediawiki.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mediawiki.example.com/privkey.pem;

    error_log  /var/log/openresty/com.example.mediawiki_nginx_err.log warn;
    access_log /var/log/openresty/com.example.mediawiki_nginx_acc.log combined;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        access_by_lua_block {
            local core = require "waf.core"
            local app  = require "waf.apps.mediawiki"
            core.run(app)
        }
    }
}
