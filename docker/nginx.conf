worker_processes auto;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    lua_package_path "/etc/openresty/?.lua;;";

    log_format waf '$remote_addr [$time_local] "$request" $status';
    access_log  /dev/stdout waf;

    # Redirect plain HTTP to HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host:8443$request_uri;
    }

    # Plain-HTTP WAF listener for online-test-full (no TLS handshake per request,
    # so the full test suite runs in ~1 minute instead of ~15 minutes).
    server {
        listen 8888;
        server_name localhost;

        location /notifications/hub {
            proxy_pass         http://vaultwarden:3012;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;

            access_by_lua_block {
                local core = require "waf.core"
                local app  = require "waf.apps.vaultwarden"
                core.run(app)
            }
        }

        location / {
            proxy_pass         http://vaultwarden:80;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            access_by_lua_block {
                local core = require "waf.core"
                local app  = require "waf.apps.vaultwarden"
                core.run(app)
            }
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/openresty/certs/cert.pem;
        ssl_certificate_key /etc/openresty/certs/key.pem;

        # WebSocket endpoint (Vaultwarden ≤1.29 / older Bitwarden clients)
        location /notifications/hub {
            proxy_pass         http://vaultwarden:3012;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;

            access_by_lua_block {
                local core = require "waf.core"
                local app  = require "waf.apps.vaultwarden"
                core.run(app)
            }
        }

        location / {
            proxy_pass         http://vaultwarden:80;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            access_by_lua_block {
                local core = require "waf.core"
                local app  = require "waf.apps.vaultwarden"
                core.run(app)
            }
        }
    }
}
