worker_processes auto;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    lua_package_path "/etc/openresty/?.lua;;";

    # nginx's own default (1m) sits right at mediawiki's largest single-field
    # cap (wpTextbox1/wpTextbox2, 1MB wikitext bodies) and well under its
    # Special:Upload route override (101MB) - both would 413 here before the
    # WAF ever runs. This is a real-traffic concern, not just a test one.
    client_max_body_size 110m;

    log_format waf '$remote_addr [$time_local] "$request" $status';
    access_log  /dev/stdout waf;

    # Redirect plain HTTP to HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host:8443$request_uri;
    }

    # Plain-HTTP WAF listener for online-test-full (no TLS handshake per request,
    # so the full test suite runs in ~1 minute instead of ~15 minutes).
    server {
        listen 8888;
        server_name localhost;

        location /notifications/hub {
            proxy_pass         http://vaultwarden:3012;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;

            access_by_lua_block {
                local core = require "waf.core"
                local app  = require "waf.apps.vaultwarden"
                core.run(app)
            }
        }

        location / {
            proxy_pass         http://vaultwarden:80;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            access_by_lua_block {
                local core = require "waf.core"
                local app  = require "waf.apps.vaultwarden"
                core.run(app)
            }
        }
    }

    # Plain-HTTP listener for mediawiki's online-test-full, proxying to a real
    # MediaWiki install (PHP-FPM, see docker/mediawiki/) running against a
    # throwaway SQLite DB. Same WAF gate as every other listener here - the
    # WAF runs in access_by_lua_block before either the static-file or PHP
    # content handler ever sees the request.
    server {
        listen 8889;
        server_name localhost;
        root /var/www/mediawiki;
        index index.php;

        # Direct script hits (index.php, api.php, load.php, rest.php,
        # thumb.php, img_auth.php, ...) - this is how every WAF route in
        # apps/mediawiki.lua expects URLs to look (no $wgArticlePath pretty-URL
        # rewriting is configured, so there's nothing for `location /` below
        # to rewrite into a .php hit).
        location ~ \.php$ {
            access_by_lua_block {
                local core = require "waf.core"
                local app  = require "waf.apps.mediawiki"
                core.run(app)
            }
            fastcgi_pass  mediawiki:9000;
            fastcgi_index index.php;
            include       fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # Static assets (skins/resources/extensions/images) served directly
        # off the shared code volume.
        location / {
            access_by_lua_block {
                local core = require "waf.core"
                local app  = require "waf.apps.mediawiki"
                core.run(app)
            }
            try_files $uri $uri/ =404;
        }
    }

    # Plain-HTTP listener for gitea's online-test-full, proxying to the
    # gitea container defined in docker/gitea/docker-compose.yml (joined to
    # this stack's network as external - see that file's own comments).
    # apps/gitea.lua (Phase 1) only models /api/v1/* - every other path
    # (web UI, git smart-HTTP, LFS) hits deny-by-default here, which is
    # expected for now, not a bug: later phases will widen coverage.
    server {
        listen 8890;
        server_name localhost;

        location / {
            proxy_pass         http://gitea:3000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            access_by_lua_block {
                local core = require "waf.core"
                local app  = require "waf.apps.gitea"
                core.run(app)
            }
        }
    }

    # Plain-HTTP listener for jellyfin's online-test-full, proxying to the
    # jellyfin container defined in docker/jellyfin/docker-compose.yml
    # (joined to this stack's network as external - see that file's own
    # comments). Single location block with websocket-upgrade headers and
    # proxy_buffering off applied vhost-wide - same shape as the real
    # production example vhost (rootfs/etc/openresty/com.example.jellyfin_nginx.conf),
    # since Jellyfin's SignalR socket isn't split onto its own path the way
    # Vaultwarden's /notifications/hub is.
    server {
        listen 8892;
        server_name localhost;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering  off;

        location / {
            proxy_pass         http://jellyfin:8096;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            access_by_lua_block {
                local core = require "waf.core"
                local app  = require "waf.apps.jellyfin"
                core.run(app)
            }
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/openresty/certs/cert.pem;
        ssl_certificate_key /etc/openresty/certs/key.pem;

        # WebSocket endpoint (Vaultwarden ≤1.29 / older Bitwarden clients)
        location /notifications/hub {
            proxy_pass         http://vaultwarden:3012;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;

            access_by_lua_block {
                local core = require "waf.core"
                local app  = require "waf.apps.vaultwarden"
                core.run(app)
            }
        }

        location / {
            proxy_pass         http://vaultwarden:80;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            access_by_lua_block {
                local core = require "waf.core"
                local app  = require "waf.apps.vaultwarden"
                core.run(app)
            }
        }
    }
}
